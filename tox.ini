install_command = pip install -i https://mirrors.tools.huawei.com/pypi/simple/ --trusted-host mirrors.tools.huawei.com {opts} {packages}
commands =
    coverage run -m pytest tests
    coverage html
    coverage xml -o coverage.xml
    diff-cover coverage.xml --html-report new_code_coverage.html --compare-branch origin/master
    pytest tests --html=testcase/report.html