[tox]
envlist = py311

[testenv]
basepython = /opt/buildtools/Python-3.11.4/python  # 关键！直接指向可执行文件
setenv =
    PYTHONPATH = {toxinidir}{:}{env:PYTHONPATH:}
deps =
    langgraph==0.2.48
    uvicorn==0.29.0
    coverage==7.4.4
    sse-starlette==2.1.0
    starlette==0.37.2
    python-multipart==0.0.9
    pymysql
    requests
    kubernetes
    DBUtils==1.2
    pytz
    pytest-html
    diff-cover
    annotated-types==0.7.0
    anthropic==0.49.0
    anyio==4.9.0
    blinker==1.9.0
    cachelib==0.13.0
    certifi==2025.1.31
    charset-normalizer==3.4.1
    click==8.1.8
    colorama==0.4.6
    distro==1.9.0
    Flask==3.1.0
    Flask-Caching==2.3.1
    flask-cors==5.0.1
    Flask-SQLAlchemy==3.1.1
    greenlet==3.2.0
    openai==1.76.0
    beautifulsoup4==4.13.4
    cachetools==5.5.2
    openpyxl==3.1.5
    h11==0.14.0
    httpcore==1.0.8
    httpx==0.28.1
    idna==3.10
    iniconfig==2.1.0
    itsdangerous==2.2.0
    Jinja2==3.1.6
    jiter==0.9.0
    MarkupSafe==3.0.2
    proto-plus==1.26.1
    protobuf==5.29.4
    pyasn1==0.6.1
    pyasn1_modules==0.4.2
    pyparsing==3.2.3
    soupsieve==2.6
    packaging==24.2
    pluggy==1.5.0
    pydantic==2.11.3
    pydantic_core==2.33.1
    uritemplate==4.1.1
    websockets==15.0.1
    PyMySQL==1.1.1
    pytest==8.3.5
    pytest-mock==3.14.0
    requests==2.32.3
    sniffio==1.3.1
    SQLAlchemy==2.0.40
    tqdm==4.67.1
    typing-inspection==0.4.0
